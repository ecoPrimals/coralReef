# coral-glowplug configuration — biomeGate: Titan V + K80 + RTX 5060
#
# This file is the reference config. Install to:
#   ~/.config/coralreef/glowplug.toml  (user service)
#   /etc/coralreef/glowplug.toml       (system service)
#
# BDFs updated 2026-05 (post-BIOS update).

[daemon]
socket = "$XDG_RUNTIME_DIR/biomeos/coral-glowplug-default.sock"
log_level = "info"
health_interval_ms = 5000

# Titan V — NVIDIA GV100 (SM70), 12 GB HBM2, VFIO at boot
# CRITICAL: do NOT boot on nouveau — desktop apps (Cursor/Xorg) will grab
# renderD* and block during shutdown, causing kernel oops on GV100.
[[device]]
bdf = "0000:02:00.0"
name = "titan-v"
boot_personality = "vfio"
power_policy = "always_on"
role = "oracle"

# Tesla K80 GPU0 — NVIDIA GK210B (SM37), 12 GB GDDR5, VFIO at boot
# Behind PLX PEX 8747 PCIe switch. Compute-only (headless).
# Use ember sacrifice pattern: dispatch failures must not wedge the PLX switch.
[[device]]
bdf = "0000:4b:00.0"
name = "k80-gpu0"
boot_personality = "vfio"
power_policy = "always_on"
role = "compute"

# Tesla K80 GPU1 — NVIDIA GK210B (SM37), 12 GB GDDR5, VFIO at boot
[[device]]
bdf = "0000:4c:00.0"
name = "k80-gpu1"
boot_personality = "vfio"
power_policy = "always_on"
role = "compute"

# RTX 5060 — NVIDIA GB206 (SM120), 16 GB GDDR7
# Display GPU — stays on nvidia proprietary driver. Protected from VFIO.
