[package]
name = "coralreef-core"
description = "Core primal library for coralReef — sovereign Rust NVIDIA shader compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "coralreef"
path = "src/main.rs"

[[bin]]
name = "or_exit_err"
path = "tests/bin/or_exit_err.rs"
required-features = []

[[bin]]
name = "or_exit_option_err"
path = "tests/bin/or_exit_option_err.rs"
required-features = []

[[bin]]
name = "or_exit_code_err"
path = "tests/bin/or_exit_code_err.rs"
required-features = []

[lints]
workspace = true

[dependencies]
coral-reef = { workspace = true }
tokio = { workspace = true, features = ["process", "fs", "net", "io-util", "time"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tarpc = { workspace = true, optional = true }
tokio-serde = { workspace = true, optional = true }
futures = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-util = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
chacha20poly1305 = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }

[features]
default = ["tarpc-transport"]
e2e = []
tarpc-transport = ["dep:tarpc", "dep:tokio-serde"]

[[test]]
name = "unix_jsonrpc_default_socket_path_env"
required-features = ["e2e"]

[dev-dependencies]
naga = { workspace = true, features = ["wgsl-in", "spv-in", "spv-out"] }
primal-rpc-client = { path = "../primal-rpc-client" }
tempfile.workspace = true
