# coralReef genomeBin Manifest
# ============================
#
# Per-primal genomeBin deployment manifest.
# Follows ecoPrimals genomeBin Architecture Standard.
#
# See: wateringHole/GENOMEBIN_ARCHITECTURE_STANDARD.md

[primal]
name = "coralreef"
version = "0.2.0"
license = "AGPL-3.0-or-later"
binary = "coralreef"
pie_verified = true
ecobin_grade = "A++"
sprint = 14
tests = 3597
description = "Sovereign Rust GPU shader compiler. Compiles WGSL/SPIR-V/GLSL compute shaders to native GPU binaries (NVIDIA SM35-SM120, AMD GCN5/RDNA2-4). Configurable SPIR-V portable output. Tensor-core GEMM codegen (HMMA via mma.sync). Artifact provenance with BLAKE3 sporePrint hash + crypto.sign integration. Pure compiler — zero unsafe, zero C dependencies."

[capabilities]
provided = [
    "shader.compile.wgsl",
    "shader.compile.spirv",
    "shader.compile.wgsl.multi",
    "shader.compile.gemm",
    "shader.compile.status",
    "shader.compile.capabilities",
    "health.check",
    "health.liveness",
    "health.readiness",
    "health.version",
    "identity.get",
    "capability.list",
    "capabilities.list",
    "btsp.negotiate",
    "auth.check",
    "auth.mode",
    "auth.peer_info",
]
consumed = [
    "compute.dispatch",
    "capability.register",
    "ipc.heartbeat",
    "primal.announce",
    "crypto.sign",
]

[capabilities.gpu_targets]
nvidia = ["sm35", "sm70", "sm75", "sm80", "sm86", "sm89", "sm120"]
amd = ["gcn5", "rdna2", "rdna3", "rdna4"]

[dependencies]
external = []

[platforms]
primary = "linux-x86_64"
cross_ready = ["linux-aarch64"]

[ipc_transports]
jsonrpc = ["unix_socket", "tcp"]
tarpc = ["unix_socket", "tcp"]

[security]
btsp_phase = 3
forbid_unsafe = ["coralreef-core", "coral-reef", "coral-reef-isa", "coral-reef-stubs", "coral-reef-bitview", "nak-ir-proc", "primal-rpc-client"]
unsafe_exception = "none — pure compiler primal, zero unsafe"
